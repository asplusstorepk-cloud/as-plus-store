<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AS Plus Limited - AS Plus Store Play Store style app download portal." />
  <title>AS Plus Limited - App Store</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8f9fa;
      --surface-2: #f0f4f9;
      --ink: #1f1f1f;
      --muted: #5f6368;
      --line: #e3e3e3;
      --blue: #0b57d0;
      --blue-hover: #0842a0;
      --pill-active: #c2e7ff;
      --pill-ink: #001d35;
      --nav-pill: #d3e3fd;
      --star: #1f1f1f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Roboto", "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding-bottom: 84px;
    }

    /* Top Header */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      padding: 12px 16px 8px;
      border-bottom: 1px solid rgba(227, 227, 227, 0.5);
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      max-width: 920px;
      margin: 0 auto 4px;
    }

    .store-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.08rem;
    }

    .play-triangle {
      width: 0;
      height: 0;
      border-top: 13px solid transparent;
      border-bottom: 13px solid transparent;
      border-left: 22px solid #0b57d0;
      position: relative;
      display: inline-block;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      position: relative;
    }

    .badge-dot-wrap {
      position: relative;
      font-size: 1.25rem;
      color: var(--ink);
      cursor: pointer;
      border: none;
      background: transparent;
      padding: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .badge-dot {
      position: absolute;
      top: -2px;
      right: -4px;
      background: #b3261e;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      min-width: 16px;
      height: 16px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }

    .avatar-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--blue);
      color: #fff;
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Notification Dashboard Dropdown */
    .notif-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.18);
      z-index: 44;
      display: none;
    }

    .notif-backdrop.open {
      display: block;
    }

    .notif-panel {
      position: fixed;
      top: 58px;
      right: 16px;
      width: min(370px, calc(100vw - 32px));
      max-height: 70vh;
      overflow-y: auto;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.14);
      z-index: 45;
      display: none;
      flex-direction: column;
    }

    .notif-panel.open {
      display: flex;
    }

    .notif-head {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .notif-head h4 {
      margin: 0;
      font-size: 0.98rem;
      font-weight: 700;
    }

    .notif-head span {
      font-size: 0.74rem;
      color: var(--muted);
    }

    .notif-list {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .notif-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s;
      border: none;
      background: transparent;
      text-align: left;
      width: 100%;
    }

    .notif-item:hover {
      background: var(--surface);
    }

    .notif-item-body {
      flex: 1;
      min-width: 0;
    }

    .notif-item-title {
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .notif-item-sub {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .notif-new-pill {
      background: var(--pill-active);
      color: var(--pill-ink);
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .notif-empty {
      padding: 24px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.45;
    }

    /* Search Bar */
    .search-wrap {
      max-width: 920px;
      margin: 10px auto 14px;
      padding: 0 16px;
    }

    .search-input {
      width: 100%;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-size: 0.92rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--blue);
      background: #fff;
    }

    .main-wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Top New Apps Auto-Scroll Carousel (3 Apps Visible) */
    .new-apps-section {
      margin-bottom: 18px;
    }

    .new-apps-track {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 2px 2px 6px;
    }

    .new-apps-track::-webkit-scrollbar {
      display: none;
    }

    .new-app-card {
      flex: 0 0 calc((100% - 20px) / 3);
      min-width: calc((100% - 20px) / 3);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }

    .new-app-card:hover {
      background: #f1f5fb;
      transform: translateY(-1px);
    }

    .new-app-name {
      font-weight: 700;
      font-size: 0.84rem;
      color: var(--ink);
      line-height: 1.25;
      height: 2.5em;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      width: 100%;
    }

    .new-app-meta {
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .btn-pill-sm {
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 6px 12px;
      font-weight: 700;
      font-size: 0.76rem;
      cursor: pointer;
      width: 100%;
      max-width: 112px;
    }

    .btn-pill-sm:hover {
      background: var(--blue-hover);
    }

    /* Featured Hero Card */
    .featured-card {
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #fff;
      margin-bottom: 22px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .featured-banner {
      height: 185px;
      background: linear-gradient(125deg, #0b57d0 0%, #0d47a1 50%, #1565c0 100%);
      padding: 18px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
      color: #fff;
      cursor: pointer;
    }

    .featured-banner h2 {
      margin: 0;
      font-size: 1.4rem;
      line-height: 1.25;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
    }

    .featured-banner-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .featured-footer {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .featured-app-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      min-width: 0;
    }

    .app-icon-box {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 1.35rem;
      flex-shrink: 0;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.14);
      background: #fff;
    }

    .app-icon-box.small {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      font-size: 1rem;
    }

    .app-icon-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .app-icon-svg {
      width: 72%;
      height: 72%;
      display: block;
    }

    .featured-title {
      font-weight: 700;
      font-size: 0.98rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .featured-sub {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .btn-pill-download {
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 8px 18px;
      font-weight: 700;
      font-size: 0.88rem;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-pill-download:hover {
      background: var(--blue-hover);
    }

    /* Section Title */
    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 6px 0 14px;
    }

    .section-heading h3 {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 700;
    }

    .section-sub {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .sub-divider-heading {
      margin: 18px 0 10px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Suggested Apps Vertical List */
    .apps-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .app-row-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 8px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .app-row-card:hover {
      background: var(--surface);
    }

    .app-row-info {
      flex: 1;
      min-width: 0;
    }

    .app-row-title {
      font-weight: 600;
      font-size: 1rem;
      margin: 0 0 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-row-cat {
      font-size: 0.84rem;
      color: var(--muted);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-row-stats {
      font-size: 0.8rem;
      color: var(--ink);
      font-weight: 600;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .match-badge {
      background: #e8f0fe;
      color: var(--blue);
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
    }

    /* App Detail Full Screen Overlay */
    .detail-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 60;
      display: none;
      flex-direction: column;
      overflow-y: auto;
      padding-bottom: 36px;
    }

    .detail-screen.open {
      display: flex;
    }

    .detail-topbar {
      position: sticky;
      top: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      z-index: 5;
    }

    .icon-btn {
      border: none;
      background: transparent;
      color: var(--ink);
      font-size: 1.3rem;
      padding: 6px;
      border-radius: 50%;
      cursor: pointer;
    }

    .detail-container {
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      padding: 6px 18px 24px;
    }

    .detail-hero {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .detail-icon {
      width: 84px;
      height: 84px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 2rem;
      font-weight: 700;
      flex-shrink: 0;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    .detail-title {
      margin: 0 0 4px;
      font-size: 1.5rem;
      line-height: 1.2;
      font-weight: 700;
    }

    .detail-dev {
      color: var(--blue);
      font-weight: 600;
      font-size: 0.92rem;
      margin-bottom: 4px;
    }

    .detail-tag {
      font-size: 0.8rem;
      color: var(--muted);
    }

    /* 3-Column Metrics Strip */
    .metrics-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      text-align: center;
      margin-bottom: 18px;
      padding: 6px 0;
    }

    .metric-cell {
      border-right: 1px solid var(--line);
      padding: 0 8px;
    }

    .metric-cell:last-child {
      border-right: none;
    }

    .metric-top {
      font-weight: 700;
      font-size: 0.94rem;
      margin-bottom: 2px;
    }

    .metric-sub {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .age-box {
      display: inline-block;
      border: 1.5px solid var(--ink);
      border-radius: 4px;
      padding: 0 5px;
      font-size: 0.78rem;
      font-weight: 700;
      line-height: 1.3;
    }

    /* Full Width Download Button */
    .btn-download-full {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      background: var(--blue);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      padding: 12px 18px;
      border-radius: 999px;
      margin-bottom: 20px;
      border: none;
      cursor: pointer;
    }

    .btn-download-full:hover {
      background: var(--blue-hover);
    }

    /* Screenshots Gallery */
    .screenshots-strip {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 20px;
      scrollbar-width: thin;
    }

    .screenshot-card {
      flex: 0 0 210px;
      height: 310px;
      border-radius: 14px;
      border: 1px solid var(--line);
      overflow: hidden;
      background: var(--surface);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
    }

    .screenshot-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Promo / Preview Card */
    .preview-banner {
      border-radius: 16px;
      padding: 20px;
      color: #fff;
      background: linear-gradient(120deg, #0b57d0 0%, #1a73e8 55%, #00838f 100%);
      margin-bottom: 22px;
      box-shadow: 0 3px 10px rgba(11, 87, 208, 0.2);
    }

    .preview-banner h4 {
      margin: 0 0 6px;
      font-size: 1.15rem;
    }

    .preview-banner p {
      margin: 0;
      font-size: 0.9rem;
      opacity: 0.95;
    }

    .about-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .about-head h3 {
      margin: 0;
      font-size: 1.15rem;
    }

    .about-body {
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.55;
      margin-bottom: 14px;
    }

    .meta-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .meta-chip {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.8rem;
      color: var(--ink);
      font-weight: 600;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface-2);
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      padding: 8px 6px 10px;
      z-index: 25;
    }

    .nav-item {
      border: none;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: var(--ink);
      font-size: 0.76rem;
      font-weight: 600;
    }

    .nav-pill {
      width: 56px;
      height: 32px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .nav-item.active .nav-pill {
      background: var(--nav-pill);
      color: var(--pill-ink);
    }
  </style>
</head>
<body>

  <!-- Top Store Bar -->
  <header class="top-bar">
    <div class="top-row">
      <div class="store-brand">
        <span class="play-triangle"></span>
        <span>AS Plus Store</span>
      </div>

      <div class="top-actions">
        <div class="badge-dot-wrap" id="downloadStatusWrap" title="Downloads">
          <span id="downloadStatusIcon">⬇</span>
          <span class="badge-dot" id="downloadStatusCount">0</span>
        </div>
        <button
          type="button"
          class="badge-dot-wrap"
          id="notifBellBtn"
          title="Notifications"
          aria-label="Notifications"
        >
          <span>🔔</span>
          <span class="badge-dot" id="notifBadgeCount">0</span>
        </button>
        <div class="avatar-circle" title="Muhammad Ansar">A</div>
      </div>
    </div>
  </header>

  <!-- Notification Dashboard (7-Day Active Window) -->
  <div class="notif-backdrop" id="notifBackdrop"></div>
  <aside class="notif-panel" id="notifPanel" aria-label="New app notifications">
    <div class="notif-head">
      <h4>New App Notifications</h4>
      <span>Last 7 days</span>
    </div>
    <div class="notif-list" id="notifList"></div>
  </aside>

  <!-- Search Input -->
  <div class="search-wrap" id="searchSection">
    <input
      type="search"
      id="searchInput"
      class="search-input"
      placeholder="Search apps, tools, games..."
    />
  </div>

  <!-- Home Content -->
  <main class="main-wrap" id="homeView">
    <!-- Top New Apps Auto-Scroll Carousel (3 Apps Visible) -->
    <section class="new-apps-section" id="newAppsSection">
      <div class="section-heading">
        <h3>New Apps</h3>
        <span class="section-sub" id="newAppsCounter"></span>
      </div>
      <div class="new-apps-track" id="newAppsTrack"></div>
    </section>

    <!-- Featured Hero Card -->
    <section class="featured-card" id="featuredCard"></section>

    <!-- Suggested / Search Results Section -->
    <div class="section-heading">
      <h3 id="listTitle">Suggested for you</h3>
      <span class="section-sub" id="appCounter"></span>
    </div>

    <section class="apps-list" id="appsList"></section>
  </main>

  <!-- App Detail Full View -->
  <section class="detail-screen" id="detailScreen">
    <div class="detail-topbar">
      <button type="button" class="icon-btn" id="backBtn" aria-label="Back">←</button>
      <div class="top-actions">
        <div class="badge-dot-wrap" id="detailDownloadStatusWrap" title="Downloads">
          <span id="detailDownloadStatusIcon">⬇</span>
          <span class="badge-dot" id="detailDownloadStatusCount">0</span>
        </div>
        <button type="button" class="icon-btn" aria-label="More">⋮</button>
      </div>
    </div>

    <div class="detail-container" id="detailContent"></div>
  </section>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button type="button" class="nav-item active" data-tab="Apps">
      <span class="nav-pill">⊞</span>
      <span>Apps</span>
    </button>
    <button type="button" class="nav-item" data-tab="Search">
      <span class="nav-pill">🔍</span>
      <span>Search</span>
    </button>
  </nav>

  <script>
    const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;

    // Official Google SVG Logos (crisp brand artwork)
    const googleSvgs = {
      chrome: `<svg class="app-icon-svg" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="21" fill="#4285F4"/>

    // 7-Day Window Check for Newly Added Apps
    function getActiveNewApps() {
      const now = Date.now();
      return apps
        .filter(app => {
          if (!app.addedAt) return false;
          const addedMs = Date.parse(app.addedAt);
          if (Number.isNaN(addedMs)) return false;
          const age = now - addedMs;
          return age >= 0 && age <= SEVEN_DAYS_MS;
        })
        .sort((a, b) => Date.parse(b.addedAt) - Date.parse(a.addedAt));
    }

    function formatRemainingDays(addedAt) {
      const elapsed = Date.now() - Date.parse(addedAt);
      const remainingDays = Math.max(1, Math.ceil((SEVEN_DAYS_MS - elapsed) / (24 * 60 * 60 * 1000)));
      return `${remainingDays}d left`;
    }

    function triggerDownloadState(url) {

    function startAutoScroll() {
      if (autoScrollRaf) cancelAnimationFrame(autoScrollRaf);
      const step = () => {
        if (!autoScrollPaused && newAppsSection.style.display !== "none") {
          const maxScroll = newAppsTrack.scrollWidth - newAppsTrack.clientWidth;
          if (maxScroll > 2) {
            newAppsTrack.scrollLeft += 0.45 * autoScrollDir;
            if (newAppsTrack.scrollLeft >= maxScroll - 1) {
              autoScrollDir = -1;
            } else if (newAppsTrack.scrollLeft <= 0) {
              autoScrollDir = 1;
            }
          }
        }
        autoScrollRaf = requestAnimationFrame(step);
      };
      autoScrollRaf = requestAnimationFrame(step);
    }

    // Play Store Priority Search & Home Catalog Rendering
    function renderStore() {
      renderNewAppsCarousel();
      renderFeatured();

      const q = searchText.trim().toLowerCase();
      appsList.innerHTML = "";

      if (q.length > 0) {
        const scoredMatches = [];
        const otherApps = [];

        apps.forEach(app => {
          const nameLower = app.name.toLowerCase();
          const devLower = app.developer.toLowerCase();
          const catLower = app.category.toLowerCase();
          const aboutLower = app.about.toLowerCase();

          let score = 0;
          if (nameLower === q) score = 100;
          else if (nameLower.startsWith(q)) score = 80;
          else if (nameLower.includes(q)) score = 60;
          else if (devLower.includes(q) || catLower.includes(q)) score = 40;
          else if (aboutLower.includes(q)) score = 20;

          if (score > 0) {
            scoredMatches.push({ app, score });
          } else {
            otherApps.push(app);
          }
        });

        scoredMatches.sort((a, b) => b.score - a.score);

        listTitle.textContent = "Search results";
        appCounter.textContent = `${scoredMatches.length} matching`;

        if (scoredMatches.length === 0) {
          const emptyMsg = document.createElement("p");
          emptyMsg.style.color = "var(--muted)";
          emptyMsg.style.padding = "8px 0";
          emptyMsg.textContent = `No exact match found for "${searchText.trim()}".`;
          appsList.appendChild(emptyMsg);
        } else {
          scoredMatches.forEach(item => {
            appsList.appendChild(createAppRowElement(item.app, true));
          });
        }

        if (otherApps.length > 0) {
          const moreHeader = document.createElement("div");
          moreHeader.className = "sub-divider-heading";
          moreHeader.innerHTML = `<span>More apps from AS Plus Store</span><span class="section-sub">${otherApps.length} apps</span>`;
          appsList.appendChild(moreHeader);

          otherApps.forEach(app => {
            appsList.appendChild(createAppRowElement(app, false));
          });
        }
        return;
      }

      listTitle.textContent = activeTab === "Search" ? "Search & browse apps" : "Suggested for you";
      appCounter.textContent = `${apps.length} apps`;
      apps.forEach(app => {
        appsList.appendChild(createAppRowElement(app, false));
      });
    }

    function openAppDetail(id) {
      const app = apps.find(item => item.id === id);
      if (!app) return;

      const sourceLabel = app.downloadUrl.includes("play.google.com")
        ? `Google Play Store • ${app.version}`
        : `Direct APK • ${app.version}`;

      const sizeMetricTitle = app.sizeLabel;
      const sizeMetricSub = app.downloadUrl.includes("play.google.com") ? "Play Store Size" : "APK Size";

      let screenshotsHtml = "";
      if (Array.isArray(app.screenshots) && app.screenshots.length > 0) {
        screenshotsHtml = `
          <div class="screenshots-strip">
            ${app.screenshots.map((src, i) => `<div class="screenshot-card"><img src="${src}" alt="${app.name} screenshot ${i + 1}" /></div>`).join("")}
          </div>
        `;
      } else if (app.svgKey) {
        screenshotsHtml = `
          <div class="screenshots-strip">
            ${buildGoogleUiPreview(app, 0)}
            ${buildGoogleUiPreview(app, 1)}
          </div>
        `;
      }

      detailContent.innerHTML = `
        <div class="detail-hero">
          ${renderDetailIconHtml(app)}
          <div>
            <h1 class="detail-title">${app.name}</h1>
            <div class="detail-dev">${app.developer}</div>
            <div class="detail-tag">${sourceLabel}</div>
          </div>
        </div>

        <div class="metrics-bar">
          <div class="metric-cell">
            <div class="metric-top">${app.rating}</div>
            <div class="metric-sub">${app.reviews}</div>
          </div>
          <div class="metric-cell">
            <div class="metric-top"><span class="age-box">${app.ageRating}</span></div>
            <div class="metric-sub">Rated for ${app.ageRating}</div>
          </div>
          <div class="metric-cell">
            <div class="metric-top">${sizeMetricTitle}</div>
            <div class="metric-sub">${sizeMetricSub}</div>
          </div>
        </div>

        <button type="button" class="btn-download-full" id="detailDownloadBtn">Download</button>

        ${screenshotsHtml}

        <div class="preview-banner">
          <h4>${app.promoTitle}</h4>
          <p>${app.promoText}</p>
        </div>

        <div class="about-head">
          <h3>About this app</h3>
          <span>→</span>
        </div>
        <p class="about-body">${app.about}</p>

        <div class="meta-chips">
          <span class="meta-chip">${app.category}</span>
          <span class="meta-chip">Version ${app.version}</span>
          <span class="meta-chip">${app.sizeLabel}</span>
        </div>
      `;

      document.getElementById("detailDownloadBtn").addEventListener("click", () => {
        triggerDownloadState(app.downloadUrl);
      });

      detailScreen.classList.add("open");
      detailScreen.scrollTop = 0;
    }

    backBtn.addEventListener("click", () => {
      detailScreen.classList.remove("open");
    });

    notifBellBtn.addEventListener("click", () => {
      if (notifPanel.classList.contains("open")) {
        closeNotificationsPanel();
      } else {
        openNotificationsPanel();
      }
    });

    notifBackdrop.addEventListener("click", closeNotificationsPanel);

    searchInput.addEventListener("input", e => {
      searchText = e.target.value;
      renderStore();
    });

    document.querySelectorAll(".nav-item").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeTab = btn.dataset.tab;
        if (activeTab === "Search") {
          searchSection.style.display = "block";
          searchInput.focus();
        }
        renderStore();
      });
    });

    updateDownloadIndicator();
    renderNotifications();
    renderStore();
  </script>
</body>
</html>
