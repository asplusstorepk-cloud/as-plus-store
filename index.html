<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AS Plus Limited - AS Plus Store Play Store style app download portal." />
  <title>AS Plus Limited - App Store</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8f9fa;
      --surface-2: #f0f4f9;
      --ink: #1f1f1f;
      --muted: #5f6368;
      --line: #e3e3e3;
      --blue: #0b57d0;
      --blue-hover: #0842a0;
      --pill-active: #c2e7ff;
      --pill-ink: #001d35;
      --nav-pill: #d3e3fd;
      --star: #1f1f1f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Roboto", "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding-bottom: 84px;
    }

    /* Top Header */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      padding: 12px 16px 8px;
      border-bottom: 1px solid rgba(227, 227, 227, 0.5);
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      max-width: 920px;
      margin: 0 auto 4px;
    }

    .store-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.08rem;
    }

    .play-triangle {
      width: 0;
      height: 0;
      border-top: 13px solid transparent;
      border-bottom: 13px solid transparent;
      border-left: 22px solid #0b57d0;
      position: relative;
      display: inline-block;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      position: relative;
    }

    .badge-dot-wrap {
      position: relative;
      font-size: 1.25rem;
      color: var(--ink);
      cursor: pointer;
      border: none;
      background: transparent;
      padding: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .badge-dot {
      position: absolute;
      top: -2px;
      right: -4px;
      background: #b3261e;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      min-width: 16px;
      height: 16px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }

    .avatar-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--blue);
      color: #fff;
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Notification Dashboard Dropdown */
    .notif-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.18);
      z-index: 44;
      display: none;
    }

    .notif-backdrop.open {
      display: block;
    }

    .notif-panel {
      position: fixed;
      top: 58px;
      right: 16px;
      width: min(370px, calc(100vw - 32px));
      max-height: 70vh;
      overflow-y: auto;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.14);
      z-index: 45;
      display: none;
      flex-direction: column;
    }

    .notif-panel.open {
      display: flex;
    }

    .notif-head {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .notif-head h4 {
      margin: 0;
      font-size: 0.98rem;
      font-weight: 700;
    }

    .notif-head span {
      font-size: 0.74rem;
      color: var(--muted);
    }

    .notif-list {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .notif-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s;
      border: none;
      background: transparent;
      text-align: left;
      width: 100%;
    }

    .notif-item:hover {
      background: var(--surface);
    }

    .notif-item-body {
      flex: 1;
      min-width: 0;
    }

    .notif-item-title {
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .notif-item-sub {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .notif-new-pill {
      background: var(--pill-active);
      color: var(--pill-ink);
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .notif-empty {
      padding: 24px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.45;
    }

    /* Search Bar */
    .search-wrap {
      max-width: 920px;
      margin: 10px auto 14px;
      padding: 0 16px;
      position: relative;
    }

    .search-form {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-size: 0.92rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--blue);
      background: #fff;
    }

    .search-submit-btn {
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.86rem;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .search-submit-btn:hover {
      background: var(--blue-hover);
    }

    .search-suggestions {
      margin-top: 8px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      display: none;
    }

    .search-suggestions.open {
      display: block;
    }

    .search-suggestion-item {
      width: 100%;
      border: none;
      background: transparent;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      text-align: left;
      border-bottom: 1px solid var(--line);
      color: var(--ink);
      font-size: 0.9rem;
    }

    .search-suggestion-item:last-child {
      border-bottom: none;
    }

    .search-suggestion-item:hover {
      background: var(--surface);
    }

    .suggestion-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .suggestion-text {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .suggestion-sub {
      font-size: 0.76rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    .main-wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Top New Apps Auto-Scroll Carousel (3 Apps Visible) */
    .new-apps-section {
      margin-bottom: 18px;
    }

    .new-apps-track {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 2px 2px 6px;
    }

    .new-apps-track::-webkit-scrollbar {
      display: none;
    }

    .new-app-card {
      flex: 0 0 calc((100% - 20px) / 3);
      min-width: calc((100% - 20px) / 3);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }

    .new-app-card:hover {
      background: #f1f5fb;
      transform: translateY(-1px);
    }

    .new-app-name {
      font-weight: 700;
      font-size: 0.84rem;
      color: var(--ink);
      line-height: 1.25;
      height: 2.5em;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      width: 100%;
    }

    .new-app-meta {
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .btn-pill-sm {
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 6px 12px;
      font-weight: 700;
      font-size: 0.76rem;
      cursor: pointer;
      width: 100%;
      max-width: 112px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-pill-sm:hover {
      background: var(--blue-hover);
    }

    .app-icon-box {
      width: 58px;
      height: 58px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 1.35rem;
      flex-shrink: 0;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
      background: #fff;
    }

    .app-icon-box.small {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      font-size: 1rem;
    }

    .app-icon-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .app-icon-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .btn-pill-download {
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 9px 18px;
      font-weight: 700;
      font-size: 0.86rem;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-pill-download:hover {
      background: var(--blue-hover);
    }

    /* Section Title */
    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 6px 0 14px;
    }

    .section-heading h3 {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 700;
    }

    .section-sub {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .sub-divider-heading {
      margin: 18px 0 10px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Homepage App Cards with Real Screenshots Below Details */
    .apps-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .app-store-card {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
      transition: box-shadow 0.15s, border-color 0.15s;
    }

    .app-store-card:hover {
      border-color: #c8d6ec;
      box-shadow: 0 3px 12px rgba(11, 87, 208, 0.08);
    }

    .app-row-header {
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
    }

    .app-rank-num {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
      width: 18px;
      text-align: center;
      flex-shrink: 0;
    }

    .app-row-info {
      flex: 1;
      min-width: 0;
    }

    .app-row-title {
      font-weight: 700;
      font-size: 1.02rem;
      margin: 0 0 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-row-dev {
      font-size: 0.8rem;
      color: var(--blue);
      font-weight: 600;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-row-cat {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-row-stats {
      font-size: 0.78rem;
      color: var(--ink);
      font-weight: 600;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .card-metrics-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      text-align: center;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    .card-metric-cell {
      border-right: 1px solid var(--line);
      padding: 0 6px;
    }

    .card-metric-cell:last-child {
      border-right: none;
    }

    .card-metric-val {
      font-weight: 700;
      font-size: 0.86rem;
      color: var(--ink);
    }

    .card-metric-lbl {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 1px;
    }

    .match-badge {
      background: #e8f0fe;
      color: var(--blue);
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
    }

    .play-source-tag {
      background: var(--surface-2);
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
    }

    /* Real-style Play Store Screenshots Strip Below App Details */
    .home-screenshots-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      margin-top: 14px;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }

    .home-screenshots-row::-webkit-scrollbar {
      height: 5px;
    }

    .home-screenshots-row::-webkit-scrollbar-thumb {
      background: #d0d7de;
      border-radius: 999px;
    }

    .shot-frame {
      flex: 0 0 154px;
      height: 248px;
      border-radius: 14px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #f8f9fa;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
      flex-shrink: 0;
    }

    .shot-frame.detail-size {
      flex: 0 0 194px;
      height: 312px;
    }

    .shot-frame.shot-image-only {
      flex: 0 0 184px;
      height: 326px;
      background: #0f1419;
      padding: 0;
    }

    .shot-real-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .shot-statusbar {
      height: 18px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.56rem;
      font-weight: 700;
      opacity: 0.9;
    }

    .shot-appbar {
      padding: 6px 8px;
      font-size: 0.7rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .shot-body {
      flex: 1;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
    }

    .shot-caption {
      padding: 6px 8px;
      font-size: 0.68rem;
      font-weight: 700;
      text-align: center;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      background: rgba(255, 255, 255, 0.92);
      color: #1f1f1f;
    }

    .shot-pill {
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 0.62rem;
      font-weight: 700;
      display: inline-block;
    }

    .shot-card {
      border-radius: 9px;
      padding: 7px 8px;
      font-size: 0.64rem;
      line-height: 1.3;
    }

    /* App Detail Full Screen Overlay */
    .detail-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 60;
      display: none;
      flex-direction: column;
      overflow-y: auto;
      padding-bottom: 36px;
    }

    .detail-screen.open {
      display: flex;
    }

    .detail-topbar {
      position: sticky;
      top: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      z-index: 5;
    }

    .icon-btn {
      border: none;
      background: transparent;
      color: var(--ink);
      font-size: 1.3rem;
      padding: 6px;
      border-radius: 50%;
      cursor: pointer;
    }

    .detail-container {
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      padding: 6px 18px 24px;
    }

    .detail-hero {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .detail-icon {
      width: 84px;
      height: 84px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 2rem;
      font-weight: 700;
      flex-shrink: 0;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    .detail-title {
      margin: 0 0 4px;
      font-size: 1.5rem;
      line-height: 1.2;
      font-weight: 700;
    }

    .detail-dev {
      color: var(--blue);
      font-weight: 600;
      font-size: 0.92rem;
      margin-bottom: 4px;
    }

    .detail-tag {
      font-size: 0.8rem;
      color: var(--muted);
    }

    /* 3-Column Metrics Strip */
    .metrics-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      text-align: center;
      margin-bottom: 18px;
      padding: 6px 0;
    }

    .metric-cell {
      border-right: 1px solid var(--line);
      padding: 0 8px;
    }

    .metric-cell:last-child {
      border-right: none;
    }

    .metric-top {
      font-weight: 700;
      font-size: 0.94rem;
      margin-bottom: 2px;
    }

    .metric-sub {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .age-box {
      display: inline-block;
      border: 1.5px solid var(--ink);
      border-radius: 4px;
      padding: 0 5px;
      font-size: 0.78rem;
      font-weight: 700;
      line-height: 1.3;
    }

    /* Full Width Download Button */
    .btn-download-full {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      background: var(--blue);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      padding: 12px 18px;
      border-radius: 999px;
      margin-bottom: 20px;
      border: none;
      cursor: pointer;
    }

    .btn-download-full:hover {
      background: var(--blue-hover);
    }

    .screenshots-strip {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 20px;
      scrollbar-width: thin;
    }

    /* Promo / Preview Card */
    .preview-banner {
      border-radius: 16px;
      padding: 20px;
      color: #fff;
      background: linear-gradient(120deg, #0b57d0 0%, #1a73e8 55%, #00838f 100%);
      margin-bottom: 22px;
      box-shadow: 0 3px 10px rgba(11, 87, 208, 0.2);
    }

    .preview-banner h4 {
      margin: 0 0 6px;
      font-size: 1.15rem;
    }

    .preview-banner p {
      margin: 0;
      font-size: 0.9rem;
      opacity: 0.95;
    }

    .about-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .about-head h3 {
      margin: 0;
      font-size: 1.15rem;
    }

    .about-body {
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.55;
      margin-bottom: 14px;
    }

    .meta-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .meta-chip {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.8rem;
      color: var(--ink);
      font-weight: 600;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface-2);
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      padding: 8px 6px 10px;
      z-index: 25;
    }

    .nav-item {
      border: none;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: var(--ink);
      font-size: 0.76rem;
      font-weight: 600;
    }

    .nav-pill {
      width: 56px;
      height: 32px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .nav-item.active .nav-pill {
      background: var(--nav-pill);
      color: var(--pill-ink);
    }
  </style>
</head>
<body>

  <!-- Top Store Bar -->
  <header class="top-bar">
    <div class="top-row">
      <div class="store-brand">

    function renderAppIconHtml(app, extraClass = "") {
      if (app.logoUrl) {
        return `<div class="app-icon-box ${extraClass}" style="background:#ffffff; border:1px solid var(--line);"><img src="${app.logoUrl}" alt="${app.name} logo" class="app-icon-img" /></div>`;
      }
      if (app.svgKey && brandSvgs[app.svgKey]) {
        return `<div class="app-icon-box ${extraClass}" style="background:transparent;">${brandSvgs[app.svgKey]}</div>`;
      }
      return `<div class="app-icon-box ${extraClass}" style="background:${app.color}">${app.iconText || app.name[0]}</div>`;
    }

    function renderDetailIconHtml(app) {
      if (app.logoUrl) {
        return `<div class="detail-icon" style="background:#ffffff; border:1px solid var(--line);"><img src="${app.logoUrl}" alt="${app.name} logo" class="app-icon-img" /></div>`;
      }
      if (app.svgKey && brandSvgs[app.svgKey]) {
        return `<div class="detail-icon" style="background:transparent;">${brandSvgs[app.svgKey]}</div>`;
      }
      return `<div class="detail-icon" style="background:${app.color}">${app.iconText || app.name[0]}</div>`;
    }

    // 7-Day Window Check for Newly Added Apps
    function getActiveNewApps() {
      const now = Date.now();
      return apps.filter(app => {
        if (!app.addedAt) return false;
        const addedMs = Date.parse(app.addedAt);
        if (Number.isNaN(addedMs)) return false;
        const age = now - addedMs;
        return age >= 0 && age <= SEVEN_DAYS_MS;
      });
    }

    function formatRemainingDays(addedAt) {
      const elapsed = Date.now() - Date.parse(addedAt);
      const remainingDays = Math.max(1, Math.ceil((SEVEN_DAYS_MS - elapsed) / (24 * 60 * 60 * 1000)));
      return `${remainingDays}d left`;
    }

    function renderNotifications() {
      const activeNotifs = getActiveNewApps();
      notifBadgeCount.textContent = String(activeNotifs.length);
      notifBadgeCount.style.display = activeNotifs.length > 0 ? "flex" : "none";

      if (activeNotifs.length === 0) {
        notifList.innerHTML = `<div class="notif-empty">No new app notifications from the last 7 days.</div>`;
        return;
      }

      notifList.innerHTML = activeNotifs
        .map(app => {
          const addedDate = new Date(app.addedAt).toLocaleDateString("en-US", {
            month: "short",
            day: "numeric"
          });
          return `
            <button type="button" class="notif-item" data-notif-open="${app.id}">
              ${renderAppIconHtml(app, "small")}
              <div class="notif-item-body">
                <div class="notif-item-title">${app.name}</div>
                <div class="notif-item-sub">Newly added ${addedDate} • ${app.developer}</div>
              </div>
              <span class="notif-new-pill">${formatRemainingDays(app.addedAt)}</span>
            </button>
          `;
        })
        .join("");

      notifList.querySelectorAll("[data-notif-open]").forEach(btn => {
        btn.addEventListener("click", () => {
          closeNotificationsPanel();
          openAppDetail(Number(btn.dataset.notifOpen));
        });
      });
    }

    function openNotificationsPanel() {
      renderNotifications();
      notifPanel.classList.add("open");
      notifBackdrop.classList.add("open");
    }

    function closeNotificationsPanel() {
      notifPanel.classList.remove("open");
      notifBackdrop.classList.remove("open");
    }

    function updateDownloadIndicator() {
      const topIcon = document.getElementById("downloadStatusIcon");
      const topCount = document.getElementById("downloadStatusCount");
      const detailIcon = document.getElementById("detailDownloadStatusIcon");
      const detailCount = document.getElementById("detailDownloadStatusCount");

      if (activeDownloads > 0) {
        topIcon.textContent = "⬇";
        detailIcon.textContent = "⬇";
        topCount.textContent = String(activeDownloads);
        detailCount.textContent = String(activeDownloads);
      } else if (completedDownloads > 0) {
        topIcon.textContent = "✔";
        detailIcon.textContent = "✔";
        topCount.textContent = String(completedDownloads);
        detailCount.textContent = String(completedDownloads);
      } else {
        topIcon.textContent = "⬇";
        detailIcon.textContent = "⬇";
        topCount.textContent = "0";
        detailCount.textContent = "0";
      }
    }

    function triggerDownloadState(url) {
      activeDownloads += 1;
      updateDownloadIndicator();
      if (url) {
        window.open(url, "_blank", "noopener,noreferrer");
      }
      setTimeout(() => {
        activeDownloads = Math.max(0, activeDownloads - 1);
        completedDownloads += 1;
        updateDownloadIndicator();
      }, 1500);
    }

    // Top Home Section: New Apps Auto-Scroll (3 Apps Visible)
    function renderNewAppsCarousel() {
      const newApps = getActiveNewApps();
      if (activeTab === "Search" || submittedQuery.length > 0 || newApps.length === 0) {
        newAppsSection.style.display = "none";
        return;
      }

      newAppsSection.style.display = "block";
      newAppsCounter.textContent = `${newApps.length} apps`;
      newAppsTrack.innerHTML = newApps
        .map(
          app => `
          <div class="new-app-card" data-open="${app.id}">
            ${renderAppIconHtml(app)}
            <div class="new-app-name">${app.name}</div>
            <div class="new-app-meta">${app.developer}</div>
            <button type="button" class="btn-pill-sm" data-dl="${app.downloadUrl}">Download</button>
          </div>
        `
        )
        .join("");

      newAppsTrack.querySelectorAll("[data-open]").forEach(card => {
        card.addEventListener("click", () => openAppDetail(Number(card.dataset.open)));
      });

      newAppsTrack.querySelectorAll("[data-dl]").forEach(btn => {
        btn.addEventListener("click", e => {
          e.stopPropagation();
          triggerDownloadState(btn.dataset.dl);
        });
      });

      startAutoScroll();
    }

    function startAutoScroll() {
      if (autoScrollRaf) cancelAnimationFrame(autoScrollRaf);
      const step = () => {
        if (!autoScrollPaused && newAppsSection.style.display !== "none") {
          const maxScroll = newAppsTrack.scrollWidth - newAppsTrack.clientWidth;
          if (maxScroll > 2) {
            newAppsTrack.scrollLeft += 0.45 * autoScrollDir;
            if (newAppsTrack.scrollLeft >= maxScroll - 1) {
              autoScrollDir = -1;
            } else if (newAppsTrack.scrollLeft <= 0) {
              autoScrollDir = 1;
            }
          }
        }
        autoScrollRaf = requestAnimationFrame(step);
      };
      autoScrollRaf = requestAnimationFrame(step);
    }

    newAppsTrack.addEventListener("mouseenter", () => { autoScrollPaused = true; });
    newAppsTrack.addEventListener("mouseleave", () => { autoScrollPaused = false; });
    newAppsTrack.addEventListener("touchstart", () => { autoScrollPaused = true; }, { passive: true });
    newAppsTrack.addEventListener("touchend", () => {
      setTimeout(() => { autoScrollPaused = false; }, 1600);
    }, { passive: true });

    function createHomepageAppCard(app, isPriorityMatch = false) {
      const card = document.createElement("article");
      card.className = "app-store-card";
      const matchTag = isPriorityMatch ? `<span class="match-badge">Match</span>` : "";
      const sourceBadge = app.sourceLabel ? app.sourceLabel : "Google Play";

      card.innerHTML = `
        <div class="app-row-header" data-open="${app.id}">
          ${renderAppIconHtml(app)}
          <div class="app-row-info">
            <div class="app-row-title">${app.name}</div>
            <div class="app-row-dev">${app.developer}</div>
            <div class="app-row-cat">${app.category}</div>
            <div class="app-row-stats">
              ${matchTag}
              <span class="play-source-tag">${sourceBadge}</span>
            </div>
          </div>
          <button type="button" class="btn-pill-download" data-dl="${app.downloadUrl}">Download</button>
        </div>
      `;

      card.querySelectorAll("[data-open]").forEach(el => {
        el.addEventListener("click", () => openAppDetail(Number(el.dataset.open)));
      });

      card.querySelector("[data-dl]").addEventListener("click", e => {
        e.stopPropagation();
        triggerDownloadState(app.downloadUrl);
      });

      return card;
    }

    function renderSearchSuggestions() {
      const q = searchText.trim().toLowerCase();
      if (!isTypingSuggestions || q.length === 0) {
        searchSuggestions.classList.remove("open");
        searchSuggestions.innerHTML = "";
        homeView.style.display = "block";
        return;
      }

      homeView.style.display = "none";

      const suggestions = [];
      const seen = new Set();

      apps.forEach(app => {
        if (
          app.name.toLowerCase().includes(q) ||
          app.developer.toLowerCase().includes(q) ||
          app.category.toLowerCase().includes(q)
        ) {
          if (!seen.has(app.name)) {
            seen.add(app.name);
            suggestions.push({ text: app.name, sub: app.category });
          }
        }
      });

      if (!seen.has(searchText.trim())) {
        suggestions.push({ text: searchText.trim(), sub: "Search store" });
      }

      searchSuggestions.innerHTML = suggestions
        .slice(0, 7)
        .map(
          s => `
          <button type="button" class="search-suggestion-item" data-suggest="${s.text.replace(/"/g, "&quot;")}">
            <span class="suggestion-left">
              <span>🔍</span>
              <span class="suggestion-text">${s.text}</span>
            </span>
            <span class="suggestion-sub">${s.sub} ↗</span>
          </button>
        `
        )
        .join("");

      searchSuggestions.classList.add("open");

      searchSuggestions.querySelectorAll("[data-suggest]").forEach(btn => {
        btn.addEventListener("click", () => {
          const picked = btn.dataset.suggest;
          searchInput.value = picked;
          searchText = picked;
          executeSearch(picked);
        });
      });
    }

    function executeSearch(query) {
      submittedQuery = query.trim();
      isTypingSuggestions = false;
      searchSuggestions.classList.remove("open");
      homeView.style.display = "block";
      renderStore();
    }

    // Play Store Priority Search & Homepage Catalog Rendering
    function renderStore() {
      if (isTypingSuggestions && searchText.trim().length > 0) {
        renderSearchSuggestions();
        return;
      }

      searchSuggestions.classList.remove("open");
      homeView.style.display = "block";
      renderNewAppsCarousel();

      const q = submittedQuery.trim().toLowerCase();
      appsList.innerHTML = "";

      if (q.length > 0) {
        const scoredMatches = [];
        const otherApps = [];

        apps.forEach(app => {
          const nameLower = app.name.toLowerCase();
          const devLower = app.developer.toLowerCase();
          const catLower = app.category.toLowerCase();
          const aboutLower = app.about.toLowerCase();

          let score = 0;
          if (nameLower === q) score = 100;
          else if (nameLower.startsWith(q)) score = 80;
          else if (nameLower.includes(q)) score = 60;
          else if (devLower.includes(q) || catLower.includes(q)) score = 40;
          else if (aboutLower.includes(q)) score = 20;

          if (score > 0) {
            scoredMatches.push({ app, score });
          } else {
            otherApps.push(app);
          }
        });

        scoredMatches.sort((a, b) => b.score - a.score);

        listTitle.textContent = "Search results";
        appCounter.textContent = `${scoredMatches.length} matching`;

        if (scoredMatches.length === 0) {
          const emptyMsg = document.createElement("p");
          emptyMsg.style.color = "var(--muted)";
          emptyMsg.style.padding = "8px 0";
          emptyMsg.textContent = `No exact match found for "${submittedQuery.trim()}".`;
          appsList.appendChild(emptyMsg);
        } else {
          scoredMatches.forEach(item => {
            appsList.appendChild(createHomepageAppCard(item.app, true));
          });
        }

        if (otherApps.length > 0) {
          const moreHeader = document.createElement("div");
          moreHeader.className = "sub-divider-heading";
          moreHeader.innerHTML = `<span>More apps from AS Plus Store</span><span class="section-sub">${otherApps.length} apps</span>`;
          appsList.appendChild(moreHeader);

          otherApps.forEach(app => {
            appsList.appendChild(createHomepageAppCard(app, false));
          });
        }
        return;
      }

      listTitle.textContent = activeTab === "Search" ? "Search & browse apps" : "Top Apps";
      appCounter.textContent = `${apps.length} apps`;
      apps.forEach(app => {
        appsList.appendChild(createHomepageAppCard(app, false));
      });
    }

    function openAppDetail(id, fromPopState = false) {
      const app = apps.find(item => item.id === id);
      if (!app) return;

      const isPlayStore = app.downloadUrl.includes("play.google.com");
      const sourceText = app.sourceLabel ? app.sourceLabel : "Google Play Store • Official App";
      const downloadBtnText = isPlayStore ? "Download on Google Play" : "Download";

      detailContent.innerHTML = `
        <div class="detail-hero">
          ${renderDetailIconHtml(app)}
          <div>
            <h1 class="detail-title">${app.name}</h1>
            <div class="detail-dev">${app.developer}</div>
            <div class="detail-tag">${sourceText}</div>
          </div>
        </div>

        <button type="button" class="btn-download-full" id="detailDownloadBtn">${downloadBtnText}</button>

        <div class="metrics-bar">
          <div class="metric-cell">
            <div class="metric-top">${app.rating}</div>
            <div class="metric-sub">Rating</div>
          </div>
          <div class="metric-cell">
            <div class="metric-top">${app.downloads}</div>
            <div class="metric-sub">Downloads</div>
          </div>
          <div class="metric-cell">
            <div class="metric-top">${app.sizeLabel}</div>
            <div class="metric-sub">Size</div>
          </div>
        </div>

        <div class="screenshots-strip">
          ${buildAppScreenshotsHtml(app, true)}
        </div>

        <div class="preview-banner">
          <h4>${app.promoTitle}</h4>
          <p>${app.promoText}</p>
        </div>

        <div class="about-head">
          <h3>About this app</h3>
          <span>→</span>
        </div>
        <p class="about-body">${app.about}</p>

        <div class="meta-chips">
          <span class="meta-chip">${app.category}</span>
          <span class="meta-chip">${app.version}</span>
          <span class="meta-chip">Rated ${app.ageRating}</span>
          <span class="meta-chip">${app.sizeLabel}</span>
        </div>
      `;

      document.getElementById("detailDownloadBtn").addEventListener("click", () => {
        triggerDownloadState(app.downloadUrl);
      });

      detailScreen.classList.add("open");
      detailScreen.scrollTop = 0;

      if (!fromPopState) {
        if (!window.history.state || window.history.state.view !== "detail" || window.history.state.appId !== id) {
          window.history.pushState({ view: "detail", appId: id }, "", `#app-${id}`);
        }
      }
    }

    function closeAppDetail(fromPopState = false) {
      if (!detailScreen.classList.contains("open")) return;
      if (!fromPopState && window.history.state && window.history.state.view === "detail") {
        window.history.back();
        return;
      }
      detailScreen.classList.remove("open");
    }

    window.addEventListener("popstate", event => {
      const state = event.state;
      if (state && state.view === "detail" && state.appId) {
        openAppDetail(Number(state.appId), true);
      } else {
        detailScreen.classList.remove("open");
      }
    });

    if (!window.history.state) {
      window.history.replaceState({ view: "home" }, "", window.location.pathname + window.location.search);
    }

    backBtn.addEventListener("click", () => {
      closeAppDetail(false);
    });

    notifBellBtn.addEventListener("click", () => {
      if (notifPanel.classList.contains("open")) {
        closeNotificationsPanel();
      } else {
        openNotificationsPanel();
      }
    });

    notifBackdrop.addEventListener("click", closeNotificationsPanel);

    searchInput.addEventListener("input", e => {
      searchText = e.target.value;
      if (searchText.trim().length > 0) {
        isTypingSuggestions = true;
        renderSearchSuggestions();
      } else {
        isTypingSuggestions = false;
        submittedQuery = "";
        renderStore();
      }
    });

    searchForm.addEventListener("submit", e => {
      e.preventDefault();
      if (searchText.trim().length > 0) {
        executeSearch(searchText);
      } else {
        isTypingSuggestions = false;
        submittedQuery = "";
        renderStore();
      }
    });

    document.querySelectorAll(".nav-item").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeTab = btn.dataset.tab;
        if (activeTab === "Search") {
          searchSection.style.display = "block";
          searchInput.focus();
        } else {
          isTypingSuggestions = false;
          submittedQuery = "";
          searchText = "";
          searchInput.value = "";
        }
        renderStore();
      });
    });

    updateDownloadIndicator();
    renderNotifications();
    renderStore();
  </script>
</body>
</html>
